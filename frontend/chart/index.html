<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escanor — TradingView Terminal</title>
  <link rel="stylesheet" href="/chart/css/tradingview_theme.css">
  <script src="/shared/klinecharts.min.js"></script>
</head>
<body>
  <div id="appRoot">

    <!-- ========================================================================= -->
    <!-- 🔝 TOP HEADER BAR                                                         -->
    <!-- ========================================================================= -->
    <header class="tv-top-bar">
      <div class="tv-top-left">
        <button id="symbolDropdownBtn" class="tv-symbol-btn" title="Instrument">
          <span>XAUUSD</span>
          <span style="font-size: 10px; color: var(--tv-text-secondary);">▼</span>
        </button>

        <div class="tv-divider"></div>

        <!-- Timeframe Selector -->
        <div id="timeframeButtonGroup" style="display: flex; gap: 2px;">
          <button class="tv-tf-btn" data-tf="1">1m</button>
          <button class="tv-tf-btn active" data-tf="5">5m</button>
          <button class="tv-tf-btn" data-tf="15">15m</button>
          <button class="tv-tf-btn" data-tf="60">1h</button>
          <button class="tv-tf-btn" data-tf="240">4h</button>
          <button class="tv-tf-btn" data-tf="1440">D</button>
        </div>

        <div class="tv-divider"></div>

        <!-- Top-Left TradingView Quick Order Pad (Red Sell / Blue Buy / Spread) -->
        <div class="tv-order-pad">
          <button id="tvQuickSellBtn" class="tv-order-btn sell" title="Sell at market">
            <span>SELL</span>
            <span id="tvTopSellPrice">----.--</span>
          </button>
          <div class="tv-spread-tag">
            <span>SPREAD</span>
            <span id="tvTopSpread">-- pt</span>
          </div>
          <button id="tvQuickBuyBtn" class="tv-order-btn buy" title="Buy at market">
            <span>BUY</span>
            <span id="tvTopBuyPrice">----.--</span>
          </button>
        </div>
      </div>

      <div class="tv-top-right">
        <a href="/mobile" style="color: var(--tv-text-secondary); text-decoration: none; font-size: 11px; padding: 4px 8px; border-radius: 4px; background: var(--tv-bg-secondary); border: 1px solid var(--tv-border); font-weight: 600;">
          📱 Mobile HUD
        </a>
        <button id="tvResetZoomBtn" class="tv-icon-btn" title="Reset View">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
          </svg>
        </button>
        <button id="tvFullscreenBtn" class="tv-icon-btn" title="Fullscreen">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ========================================================================= -->
    <!-- 📐 MAIN WORKSPACE                                                         -->
    <!-- ========================================================================= -->
    <div class="tv-workspace">

      <!-- Left Drawing Tools Dock -->
      <aside class="tv-left-toolbar">
        <!-- 1. Crosshair / Cursor Mode -->
        <button id="toolCrosshair" class="tv-tool-btn active" title="Crosshair">
          <svg viewBox="0 0 24 24">
            <path d="M11 2v4.07A8.001 8.001 0 0 0 4.07 11H2v2h2.07A8.001 8.001 0 0 0 11 19.93V24h2v-4.07A8.001 8.001 0 0 0 19.93 13H24v-2h-2.07A8.001 8.001 0 0 0 13 4.07V2h-2zm1 6a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/>
          </svg>
        </button>

        <!-- 2. Line Tools with Flyout -->
        <button id="toolLinesBtn" class="tv-tool-btn" title="Trend Line Tools">
          <svg viewBox="0 0 24 24">
            <path d="M3.5 18.5l6-6 4 4 7-7-1.41-1.41-5.59 5.59-4-4-7.41 7.41z"/>
          </svg>
          <span class="tv-tool-arrow">▶</span>
        </button>

        <!-- 3. Rectangle / Box Tool -->
        <button id="toolBoxBtn" class="tv-tool-btn" title="Rectangle (Box)">
          <svg viewBox="0 0 24 24">
            <path d="M3 5h18v14H3V5zm2 2v10h14V7H5z"/>
          </svg>
        </button>

        <!-- 4. Measure Ruler Tool -->
        <button id="toolMeasureBtn" class="tv-tool-btn" title="Measure Ruler (or hold Shift + Drag)">
          <svg viewBox="0 0 24 24">
            <path d="M2 19h20v2H2v-2zm1-5h2v3H3v-3zm4 0h2v3H7v-3zm4 0h2v3h-2v-3zm4 0h2v3h-2v-3zm4 0h2v3h-2v-3zM2 3h20v2H2V3zm1 5h2v3H3V8zm4 0h2v3H7V8zm4 0h2v3h-2V8zm4 0h2v3h-2V8zm4 0h2v3h-2V8z"/>
          </svg>
        </button>

        <div style="width: 24px; height: 1px; background-color: var(--tv-border); margin: 6px 0;"></div>

        <!-- 5. Delete Selected / Clear Drawings -->
        <button id="toolDeleteBtn" class="tv-tool-btn" title="Remove Selected / Clear Drawings">
          <svg viewBox="0 0 24 24">
            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
          </svg>
        </button>

        <!-- Flyout Menu for Line Tools -->
        <div id="lineToolsFlyout" class="tv-flyout-menu" style="display: none; top: 46px;">
          <button class="tv-flyout-item active" data-overlay="segment">
            <span>╱</span> <span>Trend Line</span>
          </button>
          <button class="tv-flyout-item" data-overlay="rayLine">
            <span>↗</span> <span>Ray Line</span>
          </button>
          <button class="tv-flyout-item" data-overlay="straightLine">
            <span>↔</span> <span>Extended Line</span>
          </button>
          <button class="tv-flyout-item" data-overlay="horizontalStraightLine">
            <span>―</span> <span>Horizontal Line</span>
          </button>
          <button class="tv-flyout-item" data-overlay="verticalStraightLine">
            <span>│</span> <span>Vertical Line</span>
          </button>
        </div>
      </aside>

      <!-- Chart Viewport -->
      <main class="tv-chart-viewport">
        <!-- Floating Live HUD Tag -->
        <div class="tv-status-pill">
          <div class="tv-status-dot"></div>
          <span id="tvStatusText">MT5 LIVE • 5056 WS</span>
          <span id="tvLatencyBadge" style="color: var(--tv-text-secondary);">-- ms</span>
        </div>

        <!-- Live Candle Countdown Timer Badge -->
        <div id="tvCountdownTimer" class="tv-countdown-badge" style="bottom: 30px;">
          --:--
        </div>

        <!-- Canvas Container -->
        <div id="klineChart"></div>
      </main>

    </div>

    <!-- Floating Action Toolbar for Selected Drawing (Matches Image 2) -->
    <div id="tvFloatingToolbar" class="tv-floating-action-bar" style="display: none;">
      <div id="tvFloatDragHandle" class="tv-float-drag" title="Drag">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/>
          <circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/>
          <circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>
        </svg>
      </div>
      <div class="tv-float-divider"></div>
      <button id="tvFloatSettingsBtn" class="tv-float-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
      <button id="tvFloatDeleteBtn" class="tv-float-btn tv-float-delete" title="Delete (Backspace)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
        </svg>
      </button>
    </div>

    <!-- Drawing Settings Modal (Zero Browser Default Alerts) -->
    <div id="tvSettingsModal" class="tv-modal-backdrop" style="display: none;">
      <div class="tv-modal-card">
        <div class="tv-modal-header">
          <span>Drawing Settings</span>
          <button id="tvCloseSettingsBtn" class="tv-modal-close">✕</button>
        </div>
        <div class="tv-modal-body">
          <div class="tv-setting-row">
            <label>Color</label>
            <input type="color" id="tvSettingColor" value="#2962ff">
          </div>
          <div class="tv-setting-row">
            <label>Line Width</label>
            <select id="tvSettingWidth">
              <option value="1">1px</option>
              <option value="2">2px</option>
              <option value="3">3px</option>
              <option value="4">4px</option>
            </select>
          </div>
          <div class="tv-setting-row" id="tvSettingFillRow">
            <label>Fill Color</label>
            <input type="color" id="tvSettingFillColor" value="#2962ff">
          </div>
          <div class="tv-setting-row">
            <label>Line Style</label>
            <select id="tvSettingLineStyle">
              <option value="solid">Solid</option>
              <option value="dashed">Dashed</option>
            </select>
          </div>
        </div>
        <div class="tv-modal-footer">
          <button id="tvSaveSettingsBtn" class="tv-btn-primary">Apply</button>
        </div>
      </div>
    </div>

    <!-- In-App Confirmation Dialog (Zero Browser Default Alerts) -->
    <div id="tvConfirmModal" class="tv-modal-backdrop" style="display: none;">
      <div class="tv-modal-card" style="max-width: 340px;">
        <div class="tv-modal-header">
          <span id="tvConfirmTitle">Confirm Action</span>
          <button id="tvConfirmCancelX" class="tv-modal-close">✕</button>
        </div>
        <div class="tv-modal-body">
          <p id="tvConfirmMessage" style="color: var(--tv-text-primary); font-size: 13px; line-height: 1.4;"></p>
        </div>
        <div class="tv-modal-footer" style="gap: 8px;">
          <button id="tvConfirmCancelBtn" class="tv-btn-secondary">Cancel</button>
          <button id="tvConfirmOkBtn" class="tv-btn-primary">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="tvToast" class="tv-toast">Drawing Saved</div>

  </div>

  <script type="module" src="/chart/js/app.js"></script>
</body>
</html>
